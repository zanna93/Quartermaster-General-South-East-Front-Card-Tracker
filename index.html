<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QMG: South Front - Card Tracker & Predictor</title>
    <style>
        :root {
            --bg-light: #e6e1d6;
            --panel-bg: #ffffff;
            --panel-border: #94a3b8;
            --text-main: #0f172a;
            --text-muted: #475569;
            
            /* DISTINCT NATION COLOR PALETTE */
            /* 🇬🇧 UK: Warm Amber / Tan */
            --uk-main: #b8924a;
            --uk-bg: #fef3c7;
            --uk-border: #d97706;
            --uk-text: #78350f;
            
            /* 🇺🇸 USA: Olive / Military Green */
            --usa-main: #15803d;
            --usa-bg: #dcfce7;
            --usa-border: #16a34a;
            --usa-text: #14532d;
            
            /* 🇫🇷 France: Royal / Pastel Blue */
            --france-main: #1d4ed8;
            --france-bg: #dbeafe;
            --france-border: #2563eb;
            --france-text: #1e3a8a;
            
            /* 🇮🇹 Pact (Italy): LIGHT ICE GRAY (Grigio Chiaro) */
            --pact-main: #64748b;
            --pact-bg: #f8fafc;
            --pact-border: #94a3b8;
            --pact-text: #334155;

            /* 🇩🇪 Germany: DARK CHARCOAL / FELDGRAU GRAY (Grigio Molto Scuro) */
            --germany-main: #1e293b;
            --germany-bg: #334155;
            --germany-border: #0f172a;
            --germany-text: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            padding: 12px;
            font-size: 13.5px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 10px 18px;
            border-radius: 10px;
            border: 1.5px solid var(--panel-border);
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 { font-size: 1.25rem; color: #78350f; display: flex; align-items: center; gap: 8px; font-weight: 800; }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .faction-tabs {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 7px 13px;
            border-radius: 6px;
            border: 1.5px solid var(--panel-border);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background: #f8fafc;
            color: var(--text-main);
            font-size: 0.82rem;
        }

        .btn-axis.active { background: #991b1b; color: white; border-color: #7f1d1d; box-shadow: 0 2px 6px rgba(153,27,27,0.35); }
        .btn-allies.active { background: #1e40af; color: white; border-color: #1e3a8a; box-shadow: 0 2px 6px rgba(30,64,175,0.35); }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 12px;
        }

        @media (max-width: 1024px) {
            .layout { grid-template-columns: 1fr; }
        }

        .stats-panel {
            background: var(--panel-bg);
            padding: 14px;
            border-radius: 10px;
            border: 1.5px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
        }

        .stat-box {
            background: #f8fafc;
            padding: 10px 12px;
            border-radius: 6px;
            border-left: 4px solid #2563eb;
            border-top: 1px solid #cbd5e1;
            border-right: 1px solid #cbd5e1;
            border-bottom: 1px solid #cbd5e1;
        }

        .stat-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.4px; }
        .stat-value { font-size: 1.35rem; font-weight: bold; margin-top: 2px; color: #0f172a; }

        /* Counter Boxes */
        .counter-box {
            background: #f8fafc;
            padding: 10px 12px;
            border-radius: 6px;
            border-top: 1px solid #cbd5e1;
            border-right: 1px solid #cbd5e1;
            border-bottom: 1px solid #cbd5e1;
        }

        .counter-box.hand { border-left: 4px solid #16a34a; }
        .counter-box.blind { border-left: 4px solid #9333ea; }

        .counter-control {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .counter-btn {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            border: 1px solid var(--panel-border);
            background: #ffffff;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter-btn:hover { background: #e2e8f0; }

        .counter-input {
            width: 50px;
            height: 30px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: bold;
            background: #ffffff;
            border: 1px solid var(--panel-border);
            border-radius: 5px;
            outline: none;
        }

        .counter-input.green { color: #15803d; }
        .counter-input.purple { color: #7e22ce; }

        /* Phase Switch Toggle */
        .phase-switch-box {
            background: #f8fafc;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }

        .phase-switch-title {
            font-size: 0.75rem;
            color: #78350f;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .switch-group {
            display: flex;
            background: #cbd5e1;
            padding: 2px;
            border-radius: 6px;
            gap: 2px;
        }

        .switch-btn {
            flex: 1;
            padding: 5px;
            text-align: center;
            font-size: 0.72rem;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }

        .switch-btn.active { background: #0284c7; color: white; }
        .switch-btn.active.late { background: #b91c1c; color: white; }

        /* REACTION PREDICTOR WITH DISTINCT NATION BACKGROUNDS */
        .reaction-stats {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .faction-reaction-group {
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            border: 1.5px solid;
        }

        .faction-reaction-group.uk { border-color: var(--uk-border); background-color: var(--uk-bg); }
        .faction-reaction-group.usa { border-color: var(--usa-border); background-color: var(--usa-bg); }
        .faction-reaction-group.francia { border-color: var(--france-border); background-color: var(--france-bg); }
        .faction-reaction-group.germania { border-color: var(--germany-border); background-color: #f1f5f9; }
        .faction-reaction-group.patto { border-color: var(--pact-border); background-color: var(--pact-bg); }

        .faction-group-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 3px;
            border-bottom: 1px solid rgba(0,0,0,0.12);
        }

        .reaction-row-compact {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            background: #ffffff;
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .reaction-row-left {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 700;
            color: #0f172a;
        }

        .prob-badge {
            font-size: 0.72rem;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 4px;
            line-height: 1.2;
        }

        .prob-high { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
        .prob-med { background: #fffbeb; color: #b45309; border: 1px solid #fde047; }
        .prob-low { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }

        .terr-inline {
            font-size: 0.68rem;
            color: #92400e;
            font-weight: 700;
            margin-top: 1px;
            padding-left: 4px;
        }

        /* Main Cards Area */
        .cards-panel {
            background: var(--panel-bg);
            padding: 16px;
            border-radius: 10px;
            border: 1.5px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
        }

        .filters {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 4px 10px;
            background: #f1f5f9;
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .filter-btn.active {
            background: #2563eb;
            color: white;
            border-color: #1d4ed8;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 10px;
            max-height: 68vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Game Cards - Distinct Backgrounds & Clear Contrast */
        .card-item {
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
            border: 2px solid;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .card-item.uk { background-color: var(--uk-bg); border-color: var(--uk-border); color: var(--uk-text); }
        .card-item.usa { background-color: var(--usa-bg); border-color: var(--usa-border); color: var(--usa-text); }
        .card-item.francia { background-color: var(--france-bg); border-color: var(--france-border); color: var(--france-text); }
        .card-item.patto { background-color: var(--pact-bg); border-color: var(--pact-border); color: var(--pact-text); }
        
        /* GERMANY: DARK CHARCOAL CARD WITH WHITE TEXT */
        .card-item.germania { 
            background-color: var(--germany-bg); 
            border-color: var(--germany-border); 
            color: var(--germany-text); 
        }
        .card-item.germania .card-title { color: #ffffff !important; }
        .card-item.germania .card-text { color: #f1f5f9 !important; }
        .card-item.germania .reaction-label { color: #f8fafc !important; }

        /* Locked Late War Cards Styling */
        .card-item.late-locked {
            opacity: 0.65;
            border-style: dashed !important;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.03), rgba(0,0,0,0.03) 10px, transparent 10px, transparent 20px);
        }

        .card-item.played {
            opacity: 0.35;
            filter: grayscale(85%);
            background-color: #cbd5e1 !important;
            border-color: #64748b !important;
            border-style: solid !important;
            color: #0f172a !important;
        }
        .card-item.played .card-title { color: #0f172a !important; }
        .card-item.played .card-text { color: #334155 !important; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .card-title {
            font-weight: 800;
            font-size: 0.95rem;
            color: #0f172a;
            line-height: 1.25;
        }

        .card-phase {
            font-size: 0.62rem;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .phase-prima { background: #dcfce7; color: #14532d; border: 1px solid #86efac; }
        .phase-intermedio { background: #fef9c3; color: #713f12; border: 1px solid #fde047; }
        .phase-tardivo { background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; }
        .phase-contingenza { background: #f3e8ff; color: #581c87; border: 1px solid #d8b4fe; }

        .lock-badge {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.62rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .faction-flag-badge {
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 800;
            color: white;
        }

        .faction-flag-badge.uk { background: var(--uk-main); }
        .faction-flag-badge.usa { background: var(--usa-main); }
        .faction-flag-badge.francia { background: var(--france-main); }
        .faction-flag-badge.germania { background: var(--germany-main); }
        .faction-flag-badge.patto { background: var(--pact-main); }

        .card-text {
            font-size: 0.8rem;
            color: #1e293b;
            margin-bottom: 8px;
            line-height: 1.38;
            font-weight: 500;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 6px;
        }

        .reaction-label {
            font-size: 0.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #0f172a;
        }

        .toggle-btn {
            padding: 4px 9px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 800;
            border: 1.5px solid #2563eb;
            background: #ffffff;
            color: #2563eb;
            cursor: pointer;
            transition: all 0.15s;
        }

        .card-item.played .toggle-btn {
            border-color: #dc2626;
            color: #dc2626;
        }

        /* COLLAPSIBLE CONTINGENCY BOX */
        .contingency-box {
            background: #faf5ff;
            border: 1.5px solid #c084fc;
            padding: 10px 12px;
            border-radius: 8px;
            margin-top: 8px;
            transition: all 0.2s ease;
        }

        .contingency-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .contingency-title-text {
            color: #6b21a8;
            font-size: 0.82rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contingency-toggle-btn {
            background: #f3e8ff;
            border: 1px solid #c084fc;
            color: #6b21a8;
            font-weight: bold;
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .contingency-content {
            margin-top: 10px;
            display: block;
        }

        .contingency-content.collapsed {
            display: none;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body>

    <header>
        <h1 id="ui-app-title">⚔️ QMG South Front - Card Tracker & Predictor</h1>
        <div class="header-controls">
            <!-- Faction Selector -->
            <div class="faction-tabs">
                <button class="btn btn-axis active" id="btn-axis" onclick="setFaction('Asse')">AXIS (Pact / Germany)</button>
                <button class="btn btn-allies" id="btn-allies" onclick="setFaction('Alleati')">ALLIES (UK / USA / France)</button>
            </div>
        </div>
    </header>

    <div class="layout">
        <!-- Stats Sidebar -->
        <div class="stats-panel">

            <!-- Phase / Late War Switch -->
            <div class="phase-switch-box">
                <div class="phase-switch-title">
                    <span>⏳ ACTIVE DECK</span>
                    <span id="phase-badge" style="font-size:0.7rem; color:#16a34a; font-weight:bold;">Mid War</span>
                </div>
                <div class="switch-group">
                    <button class="switch-btn active" id="btn-late-off" onclick="toggleLateWar(false)">1. Mid War</button>
                    <button class="switch-btn late" id="btn-late-on" onclick="toggleLateWar(true)">2. + Late War</button>
                </div>
            </div>

            <!-- Dynamic Opponent Hand Size Input -->
            <div class="counter-box hand">
                <div class="stat-title">OPPONENT HAND SIZE</div>
                <div class="counter-control">
                    <button class="counter-btn" onclick="adjustHandSize(-1)">-</button>
                    <input type="number" id="hand-size-input" class="counter-input green" value="5" min="0" max="12" onchange="onHandSizeChange()">
                    <button class="counter-btn" onclick="adjustHandSize(1)">+</button>
                    <span style="font-size:0.7rem; color:var(--text-muted); line-height:1.2;">
                        Current hand.
                    </span>
                </div>
            </div>

            <!-- Blind / Unknown Discards Counter -->
            <div class="counter-box blind">
                <div class="stat-title">FACE-DOWN DISCARDS / CONSCRIPTION</div>
                <div class="counter-control">
                    <button class="counter-btn" onclick="adjustBlindDiscards(-1)">-</button>
                    <input type="number" id="blind-input" class="counter-input purple" value="0" min="0" max="30" onchange="onBlindChange()">
                    <button class="counter-btn" onclick="adjustBlindDiscards(1)">+</button>
                    <span style="font-size:0.7rem; color:var(--text-muted); line-height:1.2;">
                        Face-down discards.
                    </span>
                </div>
            </div>

            <!-- Deck Stats -->
            <div class="stat-box">
                <div class="stat-title">Remaining Deck</div>
                <div class="stat-value" id="deck-remaining">0 cards</div>
                <div style="font-size:0.7rem; color:var(--text-muted); margin-top:2px;" id="deck-sub-breakdown">
                    <!-- Breakdown -->
                </div>
            </div>

            <!-- Streamlined Reactions Probability Section (NO SCROLL!) -->
            <div>
                <div class="stat-title" style="margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
                    <span>CHANCE IN HAND BY NATION</span>
                    <span style="font-size:0.68rem; color:#855b18; font-weight:700;">⚡ Live %</span>
                </div>
                <div class="reaction-stats" id="reaction-stats-list">
                    <!-- Compact Streamlined Groups -->
                </div>
            </div>

            <button class="btn" onclick="resetCurrentFaction()" style="background:#f1f5f9; border:1px solid #cbd5e1; color:#1e293b; margin-top:2px;">
                🔄 Reset Active Faction
            </button>
        </div>

        <!-- Main Card List Panel -->
        <div class="cards-panel">
            
            <div class="filters" id="filter-buttons-container">
                <button class="filter-btn active" onclick="setFilter('all', this)" id="f-all">All Cards</button>
                <button class="filter-btn" onclick="setFilter('deck', this)" id="f-deck">In Deck / Probable</button>
                <button class="filter-btn" onclick="setFilter('played', this)" id="f-played">Discarded Revealed</button>
                <button class="filter-btn" onclick="setFilter('Prima partita', this)" id="f-prima">First Game</button>
                <button class="filter-btn" onclick="setFilter('Intermedio', this)" id="f-mid">Mid War</button>
                <button class="filter-btn" onclick="setFilter('Tardivo', this)" id="f-late">Late War</button>
            </div>

            <!-- Main Card Grid -->
            <div class="card-grid" id="main-card-grid"></div>

            <!-- Collapsible Contingency Section -->
            <div class="contingency-box">
                <div class="contingency-header-bar" onclick="toggleContingencyBox()">
                    <div class="contingency-title-text">
                        <span>🔮 CONTINGENCY CARDS (Public Info)</span>
                        <span style="font-size:0.72rem; font-weight:normal; color:#6b21a8;">3 Physical Cards (6 Sides)</span>
                    </div>
                    <button class="contingency-toggle-btn" id="cont-collapse-btn">▼ Hide</button>
                </div>
                <div class="contingency-content" id="contingency-content-area">
                    <div class="card-grid" id="contingency-grid" style="max-height: initial;"></div>
                </div>
            </div>

        </div>
    </div>

            return phase;
        }

        function saveState() {
            localStorage.setItem('qmg_tracker_state_v15', JSON.stringify(state));
            localStorage.setItem('qmg_cont_collapsed', JSON.stringify(isContingencyCollapsed));
        }

        function toggleContingencyBox() {
            isContingencyCollapsed = !isContingencyCollapsed;
            saveState();
            renderContingencyState();
        }

        function renderContingencyState() {
            const area = document.getElementById('contingency-content-area');
            const btn = document.getElementById('cont-collapse-btn');

            if (isContingencyCollapsed) {
                area.classList.add('collapsed');
                btn.innerText = "▶ Show Contingency Cards";
            } else {
                area.classList.remove('collapsed');
                btn.innerText = "▼ Hide";
            }
        }

        function getReactionIcon(reaction) {
            if (!reaction || reaction === 'Nessuna' || reaction === '-') return '⚪';
            if (reaction.includes('AVANZARE') || reaction.includes('Advance')) return '⏩';
            if (reaction.includes('SOSTIENI') || reaction.includes('Sustain')) return '🎯';
            if (reaction.includes('TIENI DURO') || reaction.includes('Stand Fast')) return '🛡️';
            if (reaction.includes('ANTI-AEREA') || reaction.includes('Anti-Air')) return '✈️';
            if (reaction.includes('NAVALE') || reaction.includes('Naval Combat')) return '⚓';
            if (reaction.includes('SCAMBIO') || reaction.includes('Exchange')) return '⚔️';
            if (reaction.includes('RITIRATA') || reaction.includes('Retreat')) return '↩️';
            if (reaction.includes('RITIRO DELLA MARINA') || reaction.includes('Withdraw Navy')) return '🏳️';
            return '⚡';
        }

        function adjustHandSize(delta) {
            opponentHandSize = Math.max(0, Math.min(12, opponentHandSize + delta));
            document.getElementById('hand-size-input').value = opponentHandSize;
            render();
        }

        function onHandSizeChange() {
            const val = parseInt(document.getElementById('hand-size-input').value);
            if (!isNaN(val)) {
                opponentHandSize = Math.max(0, Math.min(12, val));
            }
            render();
        }

        function adjustBlindDiscards(delta) {
            blindDiscards = Math.max(0, Math.min(30, blindDiscards + delta));
            document.getElementById('blind-input').value = blindDiscards;
            render();
        }

        function onBlindChange() {
            const val = parseInt(document.getElementById('blind-input').value);
            if (!isNaN(val)) {
                blindDiscards = Math.max(0, Math.min(30, val));
            }
            render();
        }

        /* Hypergeometric Probability */
        function calcHandProbability(N_pool, K, H) {
            if (N_pool <= 0 || K <= 0 || H <= 0) return 0;
            if (N_pool <= H) return 100;
            if (N_pool - K < H) return 100;

            let pNo = 1.0;
            for (let i = 0; i < H; i++) {
                pNo *= (N_pool - K - i) / (N_pool - i);
            }
            let pAtLeastOne = (1.0 - pNo) * 100;
            return Math.min(100, Math.max(0, pAtLeastOne));
        }

        function setFaction(faction) {
            currentFaction = faction;
            document.getElementById('btn-axis').classList.toggle('active', faction === 'Asse');
            document.getElementById('btn-allies').classList.toggle('active', faction === 'Alleati');
            render();
        }

        function toggleLateWar(val) {
            includeLateWar = val;
            document.getElementById('btn-late-off').classList.toggle('active', !val);
            document.getElementById('btn-late-on').classList.toggle('active', val);
            document.getElementById('phase-badge').innerText = val ? 'Late War' : 'Mid War';
            document.getElementById('phase-badge').style.color = val ? '#b91c1c' : '#16a34a';
            render();
        }

        function handleCardToggle(cardName, isLateLocked) {
            if (isLateLocked && !includeLateWar && !state[cardName]) {
                if (confirm("This card belongs to Late War and is currently locked.\n\nDo you want to enable '2. + Late War' mode and mark this card as used?")) {
                    toggleLateWar(true);
                    toggleCard(cardName);
                }
                return;
            }
            toggleCard(cardName);
        }

        function toggleCard(cardName) {
            state[cardName] = !state[cardName];
            saveState();
            render();
        }

        function resetCurrentFaction() {
            if (confirm("Reset " + currentFaction + "?")) {
                const targetFactions = currentFaction === 'Asse' ? ['Patto', 'Germania'] : ['UK', 'USA', 'Francia'];
                rawData.deck.forEach(c => {
                    if (targetFactions.includes(c['Fazione'])) state[c['Nome Carta (IT)']] = false;
                });
                rawData.contingency.forEach(c => {
                    if (targetFactions.includes(c['Fazione'])) state[c['Nome Carta (IT)']] = false;
                });
                blindDiscards = 0;
                document.getElementById('blind-input').value = 0;
                saveState();
                render();
            }
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filters .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function render() {
            const targetFactions = currentFaction === 'Asse' ? ['Patto', 'Germania'] : ['UK', 'USA', 'Francia'];

            // 1. Deck Logic & Remaining Calculation
            const deckList = rawData.deck.filter(c => targetFactions.includes(c['Fazione']));
            let activePool = deckList.filter(c => includeLateWar || c['Fase (Beginners/Early/Late)'] !== 'Tardivo');

            let totalActiveInPool = activePool.length;
            let totalRevealedPlayed = activePool.filter(c => !!state[c['Nome Carta (IT)']]).length;
            
            let unknownPool = Math.max(0, totalActiveInPool - totalRevealedPlayed - blindDiscards);
            let drawDeckRemaining = Math.max(0, unknownPool - opponentHandSize);

            document.getElementById('deck-remaining').innerText = `${drawDeckRemaining} cards`;
            
            document.getElementById('deck-sub-breakdown').innerHTML = 
                `Unknown pool: <b>${unknownPool}</b> (Hand: ${opponentHandSize} | Deck: ${drawDeckRemaining})`;

            const effectiveHandSize = Math.min(opponentHandSize, unknownPool);

            // 2. Reaction Analysis
            const factionReactions = {};

            targetFactions.forEach(f => {
                factionReactions[f] = { counts: {}, territories: {} };
            });

            activePool.forEach(c => {
                const isPlayed = !!state[c['Nome Carta (IT)']];
                if (!isPlayed) {
                    const faction = c['Fazione'];
                    const reactEN = c['Reazione (EN)'] || '-';

                    if (reactEN !== '-' && reactEN !== '') {
                        let key = reactEN;
                        if (reactEN.includes('Stand Fast')) {
                            key = 'Stand Fast';
                            if (!factionReactions[faction].territories[key]) factionReactions[faction].territories[key] = [];
                            const terr = reactEN.replace('Stand Fast (', '').replace(')', '');
                            factionReactions[faction].territories[key].push(terr);
                        }

                        const counts = factionReactions[faction].counts;
                        counts[key] = (counts[key] || 0) + 1;
                    }
                }
            });

            const statsList = document.getElementById('reaction-stats-list');
            statsList.innerHTML = '';

            let hasAnyReactionsLeft = false;

            targetFactions.forEach(f => {
                const countsObj = factionReactions[f].counts;
                const terrObj = factionReactions[f].territories;
                const reactKeys = Object.keys(countsObj);

                if (reactKeys.length > 0) {
                    hasAnyReactionsLeft = true;
                    const fGroupEl = document.createElement('div');
                    fGroupEl.className = `faction-reaction-group ${getFactionClass(f)}`;
                    
                    const groupTitleEl = document.createElement('div');
                    groupTitleEl.className = 'faction-group-title';
                    groupTitleEl.innerText = getFactionHeaderLabel(f);
                    fGroupEl.appendChild(groupTitleEl);

                    const sorted = reactKeys.map(rKey => {
                        const count = countsObj[rKey];
                        const prob = calcHandProbability(unknownPool, count, effectiveHandSize);
                        return { key: rKey, count: count, prob: prob };
                    }).sort((a, b) => b.prob - a.prob);

                    sorted.forEach(item => {
                        const pVal = item.prob;
                        let probClass = 'prob-low';
                        if (pVal >= 60) { probClass = 'prob-high'; }
                        else if (pVal >= 30) { probClass = 'prob-med'; }

                        let terrNote = '';
                        if (item.key.includes('Stand Fast') && terrObj[item.key]) {
                            terrNote = `<div class="terr-inline">📍 Locations: ${terrObj[item.key].join(', ')}</div>`;
                        }

                        const rRow = document.createElement('div');
                        rRow.className = 'reaction-row-compact';
                        rRow.innerHTML = `
                            <div>
                                <div class="reaction-row-left">
                                    <span>${getReactionIcon(item.key)} ${item.key}</span>
                                    <span style="color:var(--text-muted); font-size:0.7rem;">(${item.count})</span>
                                </div>
                                ${terrNote}
                            </div>
                            <span class="prob-badge ${probClass}">${pVal.toFixed(0)}%</span>
                        `;
                        fGroupEl.appendChild(rRow);
                    });

                    statsList.appendChild(fGroupEl);
                }
            });

            if (!hasAnyReactionsLeft) {
                statsList.innerHTML = `<div style="color:var(--text-muted); font-size:0.82rem;">No reactions remaining!</div>`;
            }

            // 3. Render Main Card Grid
            const mainGrid = document.getElementById('main-card-grid');
            mainGrid.innerHTML = '';

            let filteredDeck = deckList.filter(c => {
                const isPlayed = !!state[c['Nome Carta (IT)']];
                if (currentFilter === 'deck') return !isPlayed && (includeLateWar || c['Fase (Beginners/Early/Late)'] !== 'Tardivo');
                if (currentFilter === 'played') return isPlayed;
                if (currentFilter === 'Prima partita' || currentFilter === 'Intermedio' || currentFilter === 'Tardivo') {
                    return c['Fase (Beginners/Early/Late)'] === currentFilter;
                }
                return true;
            });

            filteredDeck.sort((a, b) => {
                const aPlayed = !!state[a['Nome Carta (IT)']];
                const bPlayed = !!state[b['Nome Carta (IT)']];
                if (aPlayed !== bPlayed) return aPlayed ? 1 : -1;

                const aLocked = !includeLateWar && a['Fase (Beginners/Early/Late)'] === 'Tardivo';
                const bLocked = !includeLateWar && b['Fase (Beginners/Early/Late)'] === 'Tardivo';
                if (aLocked !== bLocked) return aLocked ? 1 : -1;

                return 0;
            });

            filteredDeck.forEach(c => {
                const isPlayed = !!state[c['Nome Carta (IT)']];
                const isLateLocked = !includeLateWar && c['Fase (Beginners/Early/Late)'] === 'Tardivo';
                const phase = c['Fase (Beginners/Early/Late)'];
                let phaseClass = 'phase-intermedio';
                if (phase === 'Prima partita') phaseClass = 'phase-prima';
                if (phase === 'Tardivo') phaseClass = 'phase-tardivo';

                const titlePrimary = c['Nome Carta (EN)'] || c['Nome Carta (IT)'];
                const descText = c['Descrizione / Effetto (EN)'] || c['Descrizione / Effetto (IT)'];
                const reactText = c['Reazione (EN)'] || 'None';

                const lockBadgeHtml = isLateLocked ? `<span class="lock-badge">🔒 LOCKED (Late War)</span>` : '';

                const cardEl = document.createElement('div');
                cardEl.className = `card-item ${getFactionClass(c['Fazione'])} ${isPlayed ? 'played' : ''} ${isLateLocked ? 'late-locked' : ''}`;
                cardEl.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="card-title">${titlePrimary}</div>
                        </div>
                        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:3px;">
                            ${lockBadgeHtml}
                            <span class="card-phase ${phaseClass}">${getPhaseDisplayLabel(phase)}</span>
                            <span class="faction-flag-badge ${getFactionClass(c['Fazione'])}">${getFactionFlag(c['Fazione'])}</span>
                        </div>
                    </div>
                    <div class="card-text">${descText}</div>
                    <div class="card-footer">
                        <span class="reaction-label">
                            ${getReactionIcon(c['Reazione (EN)'])}${reactText}
                        </span>
                        <button class="toggle-btn" onclick="handleCardToggle('${c['Nome Carta (IT)'].replace(/'/g, "\'")}', ${isLateLocked})">
                            ${isPlayed ? 'Restore' : (isLateLocked ? '🔒 Mark Discarded' : 'Mark Discarded')}
                        </button>
                    </div>
                `;
                mainGrid.appendChild(cardEl);
            });

            // 4. Render Contingency Cards
            const contGrid = document.getElementById('contingency-grid');
            contGrid.innerHTML = '';
            const contList = rawData.contingency.filter(c => targetFactions.includes(c['Fazione']));

            contList.sort((a, b) => {
                const aPlayed = !!state[a['Nome Carta (IT)']];
                const bPlayed = !!state[b['Nome Carta (IT)']];
                if (aPlayed === bPlayed) return 0;
                return aPlayed ? 1 : -1;
            });

            contList.forEach(c => {
                const isPlayed = !!state[c['Nome Carta (IT)']];
                const titlePrimary = c['Nome Carta (EN)'] || c['Nome Carta (IT)'];
                const descText = c['Descrizione / Effetto (EN)'] || c['Descrizione / Effetto (IT)'];

                const cardEl = document.createElement('div');
                cardEl.className = `card-item ${getFactionClass(c['Fazione'])} ${isPlayed ? 'played' : ''}`;
                cardEl.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="card-title">${titlePrimary}</div>
                        </div>
                        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:3px;">
                            <span class="card-phase phase-contingenza">Contingency</span>
                            <span class="faction-flag-badge ${getFactionClass(c['Fazione'])}">${getFactionFlag(c['Fazione'])} (${c['Carta Fisica']} - ${c['Lato']})</span>
                        </div>
                    </div>
                    <div class="card-text">${descText}</div>
                    <div class="card-footer">
                        <span class="reaction-label">${c['Fazione']}</span>
                        <button class="toggle-btn" onclick="toggleCard('${c['Nome Carta (IT)'].replace(/'/g, "\'")}')">
                            ${isPlayed ? 'Restore' : 'Mark Used'}
                        </button>
                    </div>
                `;
                contGrid.appendChild(cardEl);
            });
        }

        // Initial setup
        renderContingencyState();
        render();
    </script>
</body>
</html>
